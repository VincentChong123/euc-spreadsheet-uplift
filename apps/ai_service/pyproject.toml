[project]
name = "ringisho-ai-service"
version = "0.1.0"
description = "AI microservice for doc-micro-access-ctr"
requires-python = "==3.14.0"
dependencies = [
  "fastapi==0.136.3",
  "pydantic==2.13.4",
  "pydantic_ai==1.106.0",
  "pydantic_settings==2.14.1",
  "python-dotenv==1.2.2",
  "uvicorn==0.49.0",
  "logfire[fastapi]",
  "google-cloud-secret-manager",
  "pyyaml>=6.0.3",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pandas>=2.0.0",
  "ipykernel>=6.29.0",
  "jupyter>=1.0.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
